[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pong"
version = "1.0.0"
description = "Jeu Pong en Python (pygame) — 1 ou 2 joueurs, avec tutoriel complet"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5,<3"]

[tool.setuptools]
packages = ["pong", "pong.scenes"]
license-files = ["LICENSE", "pong/assets/OFL-Orbitron.txt"]

# Les images et la police sont indispensables au jeu : sans elles, une
# installation (`pip install .`) démarrerait puis échouerait au chargement.
[tool.setuptools.package-data]
pong = ["assets/*", "assets/start_video/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
