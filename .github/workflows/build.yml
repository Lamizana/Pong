name: Build executables

# Génère les exécutables Linux et Windows.
# Windows ne peut pas être compilé depuis Linux : la CI s'en charge.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Un blocage (tests ou PyInstaller) doit échouer vite : le timeout GitHub
    # par défaut de 6 h immobilise un runner pour rien (cf. runs #6 et #7).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Pong-linux
            binary: dist/Pong
          - os: windows-latest
            artifact: Pong-windows
            binary: dist/Pong.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        # -v : nomme chaque test dans le log (pour repérer celui qui bloque sous
        # Windows) ; -o addopts= neutralise le « -q » de pyproject.toml.
        timeout-minutes: 10
        run: python -m pytest -v -o addopts=

      - name: Construire l'exécutable
        shell: bash
        run: |
          # Séparateur de --add-data : ';' sous Windows, ':' ailleurs.
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name Pong --add-data "pong/assets${SEP}pong/assets" main.py

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
